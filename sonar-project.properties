# Análisis de calidad con SonarQube (local en http://localhost:9000).
# Antes de analizar, generar la cobertura:  npm run test:coverage
sonar.projectKey=sitecorpac
sonar.projectName=SITECORPAC
sonar.sourceEncoding=UTF-8

sonar.sources=src,middleware.ts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/.next/**,public/**,coverage/**

# Cobertura de Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
