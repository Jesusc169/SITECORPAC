# Análisis de calidad con SonarQube (local en http://localhost:9000).
# Antes de analizar, generar la cobertura:  npm run test:coverage
sonar.projectKey=sitecorpac
sonar.projectName=SITECORPAC
sonar.sourceEncoding=UTF-8

sonar.sources=src,middleware.ts
sonar.tests=src,tests,e2e
sonar.test.inclusions=src/**/*.test.ts,tests/**/*.ts,e2e/**/*
sonar.exclusions=**/node_modules/**,**/.next/**,public/**,coverage/**,**/*.test.ts

# Cobertura de Vitest (unitarios + integración contra MySQL)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Las pantallas de React no se miden con tests unitarios: las cubren las
# pruebas E2E de Playwright (carpeta e2e/, npm run test:e2e). La lógica
# (API, controladores, modelos, lib, services, middleware) sí se mide y el
# CI exige 100%.
sonar.coverage.exclusions=src/app/**/*.tsx,src/components/**,src/views/**,src/hooks/**,src/types/**,src/app/**/*.css,src/styles/**
